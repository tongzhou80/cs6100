<html>
    <head>
        <title>Block and Inline Elements</title>
        <style>
            .container {
                display: flex;
                width: 60%;
                height: 60%;
                flex-direction: column;
                align-items: flex-end;
                justify-content: center;
                border: 1px solid blue;
            }
            .item {
                background-color: lightblue;
                border: 1px solid lightblue;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="item">
                Div 1
            </div>
            <div class="item" style="align-self: flex-start;">
                Div 2
            </div>
            <div class="item">
                Div 3
            </div>

            
        </div>
    </body>
</html>
